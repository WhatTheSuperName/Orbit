<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форумы | Темная сеть</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(45deg, #bb86fc, #3700b3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: #e0e0e0;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: #333;
            color: #bb86fc;
        }

        .forums-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .forums-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .forums-header h1 {
            color: #bb86fc;
            font-size: 2.5rem;
        }

        .create-topic-btn {
            padding: 1rem 2rem;
            background: #bb86fc;
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .create-topic-btn:hover {
            background: #9b66dc;
            transform: scale(1.05);
        }

        .topics-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .topic-card {
            background: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(5px);
            border: 1px solid #333;
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .topic-card:hover {
            border-color: #bb86fc;
            transform: translateX(10px);
            box-shadow: 0 5px 20px rgba(187, 134, 252, 0.2);
        }

        .topic-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .topic-title {
            font-size: 1.4rem;
            color: #bb86fc;
            margin-bottom: 0.5rem;
        }

        .topic-meta {
            display: flex;
            gap: 1rem;
            color: #888;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }

        .topic-stats {
            display: flex;
            gap: 1.5rem;
            color: #888;
        }

        .topic-likes {
            color: #ff4081;
            font-weight: 600;
        }

        .topic-author {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
        }

        .modal-content {
            background: #2a2a2a;
            max-width: 500px;
            margin: 100px auto;
            padding: 2rem;
            border-radius: 20px;
            border: 1px solid #404040;
        }

        .modal-content h2 {
            color: #bb86fc;
            margin-bottom: 1.5rem;
        }

        .modal-content input,
        .modal-content textarea {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            background: #333;
            border: 1px solid #404040;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1rem;
        }

        .modal-content input:focus,
        .modal-content textarea:focus {
            outline: none;
            border-color: #bb86fc;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .modal-buttons button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-buttons .save-btn {
            background: #bb86fc;
            color: #000;
        }

        .modal-buttons .cancel-btn {
            background: #404040;
            color: #e0e0e0;
        }

        .modal-buttons button:hover {
            transform: scale(1.05);
        }

        .topic-detail {
            display: none;
            background: rgba(30, 30, 30, 0.95);
            border-radius: 20px;
            padding: 2rem;
            margin-top: 2rem;
        }

        .topic-detail.active {
            display: block;
        }

        .back-btn {
            background: none;
            border: 1px solid #bb86fc;
            color: #bb86fc;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #bb86fc;
            color: #000;
        }

        .topic-posts {
            margin-top: 2rem;
        }

        .post-item {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid #404040;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            color: #888;
        }

        .post-author {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .post-likes {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .like-btn {
            background: none;
            border: none;
            color: #ff4081;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .reply-input {
            margin-top: 2rem;
        }

        .reply-input textarea {
            width: 100%;
            padding: 1rem;
            background: #2a2a2a;
            border: 1px solid #404040;
            border-radius: 12px;
            color: #e0e0e0;
            margin-bottom: 1rem;
            resize: vertical;
        }

        .reply-input button {
            padding: 0.8rem 2rem;
            background: #bb86fc;
            border: none;
            border-radius: 8px;
            color: #000;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">🌑 Темная сеть</div>
        <div class="nav-links">
            <a href="main.html">Главная</a>
            <a href="messenger.html">Мессенджер</a>
            <a href="forum.html">Форумы</a>
            <a href="shop.html">Маркетплейс</a>
        </div>
    </nav>

    <div class="forums-container">
        <div class="forums-header">
            <h1>Форумы сообщества</h1>
            <button class="create-topic-btn" onclick="showCreateTopicModal()">➕ Создать тему</button>
        </div>

        <div class="topics-list" id="topicsList"></div>

        <div class="topic-detail" id="topicDetail">
            <button class="back-btn" onclick="hideTopicDetail()">← Назад к темам</button>
            <div id="topicDetailContent"></div>
        </div>
    </div>

    <div class="modal" id="createTopicModal">
        <div class="modal-content">
            <h2>Создать новую тему</h2>
            <input type="text" id="newTopicTitle" placeholder="Название темы">
            <textarea id="newTopicContent" placeholder="Первое сообщение..."></textarea>
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="hideCreateTopicModal()">Отмена</button>
                <button class="save-btn" onclick="createTopic()">Создать</button>
            </div>
        </div>
    </div>

    <script src="scriptforums.js"></script>
</body>
</html>
