<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit | Forum</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }

        .navbar {
            background: #121212;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            color: #7c3aed;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: #e0e0e0;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }

        .nav-links a:hover {
            background: #2a2a2a;
            color: #7c3aed;
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: #7c3aed;
            font-size: 2rem;
        }

        .create-btn {
            padding: 0.8rem 1.5rem;
            background: #7c3aed;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .create-btn:hover {
            background: #6d28d9;
        }

        .topics {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .topic {
            background: #121212;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .topic:hover {
            border-color: #7c3aed;
            transform: translateX(5px);
        }

        .topic-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .topic-title {
            font-size: 1.2rem;
            color: #7c3aed;
        }

        .topic-likes {
            color: #ec4899;
        }

        .topic-meta {
            display: flex;
            gap: 1rem;
            color: #666;
            font-size: 0.9rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
        }

        .modal-content {
            background: #121212;
            max-width: 500px;
            margin: 100px auto;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
        }

        .modal-content h2 {
            color: #7c3aed;
            margin-bottom: 1.5rem;
        }

        .modal-content input,
        .modal-content textarea {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .modal-buttons button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .save-btn {
            background: #7c3aed;
            color: #fff;
        }

        .cancel-btn {
            background: #2a2a2a;
            color: #fff;
        }

        .topic-detail {
            display: none;
        }

        .topic-detail.active {
            display: block;
        }

        .back-btn {
            background: none;
            border: 1px solid #7c3aed;
            color: #7c3aed;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .posts {
            margin-top: 2rem;
        }

        .post {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            color: #888;
        }

        .like-btn {
            background: none;
            border: none;
            color: #ec4899;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .reply-area {
            margin-top: 2rem;
        }

        .reply-area textarea {
            width: 100%;
            padding: 1rem;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            margin-bottom: 1rem;
        }

        .reply-area button {
            padding: 0.8rem 2rem;
            background: #7c3aed;
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">ORBIT</div>
        <div class="nav-links">
            <a href="main.html">Home</a>
            <a href="messenger.html">Messenger</a>
            <a href="forum.html">Forum</a>
            <a href="shop.html">Market</a>
        </div>
    </nav>

    <div class="container">
        <div class="header" id="mainHeader">
            <h1>Forum</h1>
            <button class="create-btn" onclick="showCreateModal()">+ New Topic</button>
        </div>

        <div class="topics" id="topicsList"></div>

        <div class="topic-detail" id="topicDetail">
            <button class="back-btn" onclick="hideDetail()">← Back</button>
            <div id="topicContent"></div>
        </div>
    </div>

    <div class="modal" id="createModal">
        <div class="modal-content">
            <h2>Create New Topic</h2>
            <input type="text" id="topicTitle" placeholder="Title">
            <textarea id="topicMessage" placeholder="Your message..." rows="5"></textarea>
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="hideCreateModal()">Cancel</button>
                <button class="save-btn" onclick="createTopic()">Create</button>
            </div>
        </div>
    </div>

    <script src="scriptforums.js"></script>
</body>
</html>
