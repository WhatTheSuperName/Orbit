<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit | Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: #121212;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            color: #7c3aed;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: #e0e0e0;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-links a:hover {
            background: #2a2a2a;
            color: #7c3aed;
        }

        .user-name {
            color: #7c3aed;
            font-weight: 500;
            margin-right: 1rem;
        }

        .logout-btn {
            background: #2a2a2a;
            border: none;
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .hero h1 {
            font-size: 5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #7c3aed, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            letter-spacing: 4px;
        }

        .hero p {
            font-size: 1.3rem;
            color: #a0a0a0;
            margin-bottom: 4rem;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            max-width: 1000px;
            margin: 2rem auto;
        }

        .feature-card {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 2rem;
            transition: all 0.3s;
            text-decoration: none;
            color: white;
        }

        .feature-card:hover {
            border-color: #7c3aed;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.2);
        }

        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .feature-title {
            font-size: 1.3rem;
            color: #7c3aed;
            margin-bottom: 0.5rem;
        }

        .feature-desc {
            color: #a0a0a0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .stats {
            display: flex;
            gap: 3rem;
            margin-top: 3rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 600;
            color: #7c3aed;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid #2a2a2a;
            color: #666;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 3rem; }
            .features { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">ORBIT</div>
        <div class="nav-links" id="navLinks">
            <!-- Dynamic content based on login status -->
        </div>
    </nav>

    <div class="hero">
        <h1>ORBIT</h1>
        <p>Orbit - a separate part of your life</p>
        
        <div class="features" id="featuresSection">
            <!-- Dynamic features based on login status -->
        </div>

        <div class="stats" id="stats">
            <div class="stat-item">
                <div class="stat-number" id="userCount">0</div>
                <div class="stat-label">users</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="topicCount">0</div>
                <div class="stat-label">topics</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="listingCount">0</div>
                <div class="stat-label">listings</div>
            </div>
        </div>
    </div>

    <footer>
        © 2024 Orbit. All rights reserved.
    </footer>

    <script src="mainscript.js"></script>
</body>
</html>
