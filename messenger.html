<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit | Messenger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: #121212;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            color: #7c3aed;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: #e0e0e0;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }

        .nav-links a:hover {
            background: #2a2a2a;
            color: #7c3aed;
        }

        .user-name {
            color: #7c3aed;
            font-weight: 500;
        }

        .messenger {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background: #121212;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid #2a2a2a;
        }

        .sidebar-header h2 {
            color: #7c3aed;
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .search {
            width: 100%;
            padding: 0.8rem;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
        }

        .contacts {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .contact {
            display: flex;
            align-items: center;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            position: relative;
        }

        .contact:hover {
            background: #1e1e1e;
        }

        .contact.active {
            background: #1e1e1e;
            border-color: #7c3aed;
        }

        .contact.unread::after {
            content: '●';
            color: #7c3aed;
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
        }

        .contact-avatar {
            font-size: 2rem;
            margin-right: 1rem;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2a2a2a;
            border-radius: 50%;
        }

        .contact-info {
            flex: 1;
        }

        .contact-name {
            font-weight: 500;
            margin-bottom: 0.2rem;
        }

        .contact-status {
            font-size: 0.8rem;
            color: #666;
        }

        .contact-status.online {
            color: #10b981;
        }

        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f0f0f;
        }

        .chat-header {
            padding: 1.5rem;
            border-bottom: 1px solid #2a2a2a;
            background: #121212;
        }

        .chat-header h3 {
            color: #7c3aed;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 60%;
            padding: 1rem;
            border-radius: 12px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.sent {
            align-self: flex-end;
            background: #7c3aed;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            align-self: flex-start;
            background: #1e1e1e;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.5);
            margin-top: 0.3rem;
            text-align: right;
        }

        .input-area {
            padding: 1.5rem;
            border-top: 1px solid #2a2a2a;
            display: flex;
            gap: 1rem;
            background: #121212;
        }

        .message-input {
            flex: 1;
            padding: 1rem;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
        }

        .message-input:focus {
            outline: none;
            border-color: #7c3aed;
        }

        .send-btn {
            padding: 1rem 2rem;
            background: #7c3aed;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .send-btn:hover {
            background: #6d28d9;
        }

        .no-auth {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
        }

        .no-auth button {
            padding: 1rem 3rem;
            background: #7c3aed;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">ORBIT</div>
        <div class="nav-links" id="navLinks"></div>
    </nav>

    <div class="messenger" id="messengerContainer"></div>

    <script src="scriptmessenger.js"></script>
</body>
</html>
