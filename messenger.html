<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер | Темная сеть</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(45deg, #bb86fc, #3700b3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: #e0e0e0;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: #333;
            color: #bb86fc;
        }

        .messenger-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 80px);
            overflow: hidden;
        }

        .contacts-sidebar {
            width: 300px;
            background: rgba(20, 20, 20, 0.95);
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .contacts-header {
            padding: 1.5rem;
            border-bottom: 1px solid #333;
        }

        .contacts-header h2 {
            color: #bb86fc;
            margin-bottom: 1rem;
        }

        .search-contacts {
            width: 100%;
            padding: 0.8rem;
            background: #2a2a2a;
            border: 1px solid #404040;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 0.9rem;
        }

        .search-contacts:focus {
            outline: none;
            border-color: #bb86fc;
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .contact-item:hover {
            background: #2a2a2a;
            border-color: #404040;
        }

        .contact-item.active {
            background: #2a2a2a;
            border-color: #bb86fc;
        }

        .contact-avatar {
            font-size: 2rem;
            margin-right: 1rem;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #333;
            border-radius: 50%;
        }

        .contact-info {
            flex: 1;
        }

        .contact-name {
            font-weight: 500;
            margin-bottom: 0.2rem;
        }

        .contact-status {
            font-size: 0.8rem;
            color: #888;
        }

        .contact-status.online {
            color: #4caf50;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(25, 25, 25, 0.9);
        }

        .chat-header {
            padding: 1.5rem;
            border-bottom: 1px solid #333;
            background: rgba(30, 30, 30, 0.95);
        }

        .chat-header h3 {
            color: #bb86fc;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 60%;
            padding: 1rem;
            border-radius: 12px;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.sent {
            align-self: flex-end;
            background: #bb86fc;
            color: #000;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            align-self: flex-start;
            background: #2a2a2a;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.6);
            margin-top: 0.3rem;
            text-align: right;
        }

        .message-input-area {
            padding: 1.5rem;
            border-top: 1px solid #333;
            display: flex;
            gap: 1rem;
            background: rgba(30, 30, 30, 0.95);
        }

        .message-input {
            flex: 1;
            padding: 1rem;
            background: #2a2a2a;
            border: 1px solid #404040;
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 1rem;
        }

        .message-input:focus {
            outline: none;
            border-color: #bb86fc;
        }

        .send-button {
            padding: 1rem 2rem;
            background: #bb86fc;
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-button:hover {
            background: #9b66dc;
            transform: scale(1.05);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #404040;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #bb86fc;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">🌑 Темная сеть</div>
        <div class="nav-links">
            <a href="main.html">Главная</a>
            <a href="messenger.html">Мессенджер</a>
            <a href="forum.html">Форумы</a>
            <a href="shop.html">Маркетплейс</a>
        </div>
    </nav>

    <div class="messenger-container">
        <div class="contacts-sidebar">
            <div class="contacts-header">
                <h2>Контакты</h2>
                <input type="text" class="search-contacts" placeholder="Поиск контактов...">
            </div>
            <div class="contacts-list" id="contactsList"></div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <h3 id="currentChatName">Выберите контакт</h3>
            </div>
            <div class="messages-container" id="messagesContainer"></div>
            <div class="message-input-area">
                <input type="text" class="message-input" id="messageInput" placeholder="Введите сообщение...">
                <button class="send-button" id="sendMessageBtn">Отправить</button>
            </div>
        </div>
    </div>

    <script src="scriptmessenger.js"></script>
</body>
</html>
