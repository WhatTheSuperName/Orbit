<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit | Marketplace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }

        .navbar {
            background: #121212;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            color: #7c3aed;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: #e0e0e0;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }

        .nav-links a:hover {
            background: #2a2a2a;
            color: #7c3aed;
        }

        .user-name {
            color: #7c3aed;
            font-weight: 500;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: #7c3aed;
            font-size: 2rem;
        }

        .create-btn {
            padding: 0.8rem 1.5rem;
            background: #7c3aed;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-input {
            flex: 1;
            min-width: 200px;
            padding: 0.8rem;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
        }

        .filter-select {
            padding: 0.8rem;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            min-width: 150px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .card {
            background: #121212;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .card:hover {
            border-color: #7c3aed;
            transform: translateY(-5px);
        }

        .category {
            display: inline-block;
            padding: 0.2rem 1rem;
            background: #2a2a2a;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }

        .title {
            font-size: 1.2rem;
            color: #7c3aed;
            margin-bottom: 0.5rem;
        }

        .desc {
            color: #a0a0a0;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .price {
            font-size: 1.3rem;
            color: #10b981;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .seller {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #666;
            border-top: 1px solid #2a2a2a;
            padding-top: 1rem;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #121212;
            max-width: 500px;
            width: 90%;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
        }

        .modal-content h2 {
            color: #7c3aed;
            margin-bottom: 1.5rem;
        }

        .modal-content input,
        .modal-content textarea,
        .modal-content select {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .modal-buttons button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .save-btn {
            background: #7c3aed;
            color: #fff;
        }

        .cancel-btn {
            background: #2a2a2a;
            color: #fff;
        }

        .contact-btn {
            width: 100%;
            padding: 1rem;
            background: #7c3aed;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }

        .detail-price {
            font-size: 2rem;
            color: #10b981;
            margin: 1rem 0;
        }

        .no-auth {
            text-align: center;
            padding: 4rem;
        }

        .no-auth button {
            padding: 1rem 3rem;
            background: #7c3aed;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">ORBIT</div>
        <div class="nav-links" id="navLinks"></div>
    </nav>

    <div class="container" id="shopContainer"></div>

    <script src="scriptshop.js"></script>
</body>
</html>
